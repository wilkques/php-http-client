name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # composer.json declares "php": ">=5.3", verified by hand against real
  # PHP 5.3.10 (not just `php -l` on a newer runtime) — see
  # wilkques/filesystem's CI comments for the same set of PHP 5.4+/5.5+
  # traps this package also avoids (short array syntax, (new Foo())->bar()
  # chaining, function-result array dereferencing, ::class, etc.), plus
  # two http-specific ones: CURLFile/curl_file_create() branch on
  # function_exists() rather than PHP version (see CurlHandle::createFile()),
  # and reserved-word method names (Pool::as() -> alias(), Response::throw()
  # -> throwException()) since 5.3 has no context-sensitive lexer.
  #
  # 5.3 needs its own job rather than a matrix entry alongside the others
  # below: its image's glibc predates the Node.js runtime the Actions
  # runner injects into job `container:`s (and into `shivammathur/setup-
  # php`'s own installation), which would break both actions/checkout and
  # setup-php. Composer itself has the same problem one version up — 2.3+
  # dropped PHP <7.2.5 outright — so this job downloads the last 2.2.x LTS
  # release (which still ran on 5.3) on the host runner, then mounts it
  # into a plain `docker run` for both `composer install` and `phpunit`.
  #
  # ClientTest/PoolTest/HttpTest need a live HTTP server to actually send
  # requests to (tests/Support/echo-server.php, reports back whatever it
  # received so assertions check real request/response behavior, not just
  # that curl_exec() didn't error) — started with the runner's own
  # pre-installed system PHP, independent of whichever PHP version is
  # actually under test, since a plain echo server's own PHP version is
  # irrelevant to what it's verifying. The 5.3 container reaches it via
  # --network host on 127.0.0.1:8080 (TestCase::serverUrl()'s default).
  test-php53:
    name: "PHPUnit (PHP 5.3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start echo server (system PHP, independent of PHP 5.3 under test)
        run: php -S 127.0.0.1:8080 tests/Support/echo-server.php &

      - name: Download Composer 2.2 LTS (last release supporting PHP 5.3)
        run: curl -sSL https://getcomposer.org/download/2.2.25/composer.phar -o composer53.phar

      - name: Install dependencies and run test suite on PHP 5.3
        run: |
          docker run --rm --network host -v "$PWD":/app -w /app cespi/php-5.3:cli sh -c '
            php composer53.phar install --no-interaction --prefer-dist &&
            vendor/bin/phpunit -c phpunit.xml
          '

  test:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.6 up: shivammathur/setup-php and actions/checkout both work
        # normally here, unlike on 5.3 — see test-php53 above.
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Start echo server (system PHP, independent of the matrix PHP version)
        run: php -S 127.0.0.1:8080 tests/Support/echo-server.php &

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit -c phpunit.xml
